// Combat's clan plugin for the server owner (Spigot 1.8.8, runs on Java 8): build/libs/SteinCombat.jar.
//
//   ./gradlew -p plugin build           compile, check the formatting, pack the jar
//   ./gradlew -p plugin spotlessApply   format the Java code (google-java-format, AOSP style) and add the header
//
// It is not released with the mod: the jar goes to the server owner by hand (as before, from stein-master's
// tools/build-plugins.sh). Offline, or without access to Spigot's repository, a local jar of the Spigot API (or
// of the whole server) works instead: -Pspigot.jar=<path to spigot-1.8.8.jar>.
plugins {
    id 'java'
    id 'com.diffplug.spotless' version '8.10.4'
}

version = '0.0.3'

repositories {
    mavenCentral()
    // The Spigot API (and the BungeeCord chat API it depends on).
    maven { url = uri('https://hub.spigotmc.org/nexus/content/repositories/snapshots/') }
    maven { url = uri('https://hub.spigotmc.org/nexus/content/groups/public/') }
}

def spigotJar = providers.gradleProperty('spigot.jar')
dependencies {
    if (spigotJar.present) {
        compileOnly files(spigotJar.get())
    } else {
        compileOnly 'org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT'
    }
}

tasks.withType(JavaCompile).configureEach {
    // The servers this plugin is for run on Java 8.
    options.release = 8
    options.encoding = 'UTF-8'
    // javac warns that release 8 is obsolete: it is on purpose.
    options.compilerArgs.add('-Xlint:-options')
}

tasks.named('jar') {
    archiveFileName = 'SteinCombat.jar'
    from(rootProject.file('../LICENSE')) { into 'META-INF' }
    from(rootProject.file('../NOTICE')) { into 'META-INF' }
}

// plugin.yml carries the version: it must match this build's.
tasks.named('processResources') {
    def v = version
    inputs.property('version', v)
    doLast {
        def yml = file("${destinationDir}/plugin.yml").text
        if (!yml.contains("version: $v")) {
            throw new GradleException("plugin.yml does not say version: $v")
        }
    }
}

spotless {
    lineEndings = com.diffplug.spotless.LineEnding.UNIX
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.36.1').aosp().reorderImports(true)
        licenseHeader '''/*
 * This Source Code Form is subject to the terms of the Mozilla Public
 * License, v. 2.0. If a copy of the MPL was not distributed with this
 * file, You can obtain one at https://mozilla.org/MPL/2.0/.
 *
 * Copyright (c) 2026 Breno Xavier
 */

'''
    }
}
